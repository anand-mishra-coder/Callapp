<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CallWave Pro</title><link rel="stylesheet" href="css/app.css">
</head><body>
<div id="toast"></div>
<section id="login" class="login"><div class="login-card"><div class="logo">CW</div><h1>CallWave Pro</h1><p>Private chat, status and real-time calls.</p><button id="googleLogin">Continue with Google</button><small>Configure only <b>js/firebase-config.js</b>.</small></div></section>

<section id="app" class="app hidden">
<header class="header"><div class="brand"><b>CW</b><span>CallWave</span></div>
<div class="profile"><img id="mePhoto"><div><strong id="meName"></strong><small id="meEmail"></small></div><button id="logout">Sign out</button></div></header>

<div class="shell">
<aside class="sidebar">
<div class="tabs">
<button class="tab active" data-view="chats">Chats</button>
<button class="tab" data-view="status">Status</button>
<button class="tab" data-view="calls">Calls</button>
</div>
<div class="search"><input id="search" placeholder="Search people or chats"></div>
<div id="list"></div>
</aside>
<main class="main">
<div id="empty" class="empty"><div class="empty-logo">CW</div><h2>CallWave Pro</h2><p>Select a chat or start a call.</p></div>

<section id="chat" class="chat hidden">
<header class="chat-head"><div class="chat-user"><img id="chatPhoto"><div><strong id="chatName"></strong><small id="chatPresence"></small></div></div>
<div class="chat-tools"><button id="audioCall">☎</button><button id="videoCall">▣</button></div></header>
<div id="messages" class="messages"></div>
<form id="messageForm" class="composer"><input id="messageInput" autocomplete="off" placeholder="Type a message"><button>Send</button></form>
</section>
</main>
</div>
</section>

<div id="incoming" class="overlay hidden"><div class="incoming-card"><img id="incPhoto"><h2 id="incName"></h2><p id="incType"></p><div><button id="decline">Decline</button><button id="accept">Accept</button></div></div></div>

<div id="call" class="overlay hidden"><div class="callbox">
<header><div><b id="callName"></b><small id="callState">Connecting…</small></div><button id="hangup">End</button></header>
<div class="stage"><video id="remote" autoplay playsinline></video><span id="connecting">Connecting…</span><video id="local" autoplay muted playsinline></video></div>
<footer><button id="mute">Mic</button><button id="cam">Camera</button><button id="speaker">Speaker</button></footer>
</div></div>
<script type="module" src="js/app.js"></script></body></html>
